name: Namespace CI

# Fork-owned CI. Self-contained so upstream (microsoft/vscode) syncs stay
# conflict-free: it does not modify any inherited workflow. Compile and
# the Linux / macOS unit/integration tests all run on Namespace (nscloud)
# runners. pr-darwin-test.yml is left unused so vscode syncs stay clean.

on:
  pull_request:
    branches:
      - main
      - 'namespace-release/*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  VSCODE_QUALITY: 'oss'

jobs:
  compile:
    name: Compile
    runs-on:
      - nscloud-ubuntu-22.04-amd64-16x32-with-cache
      - nscloud-cache-size-20gb
      - nscloud-cache-tag-ovsc-ci-compile
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Cache npm downloads (Namespace Cache Volume)
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: npm

      - name: Install build tools
        run: sudo apt update -y && sudo apt install -y build-essential pkg-config libx11-dev libx11-xcb-dev libxkbfile-dev libnotify-bin libkrb5-dev

      - name: Install dependencies
        run: |
          set -e

          for i in {1..5}; do # try 5 times
            npm ci && break
            if [ $i -eq 5 ]; then
              echo "Npm install failed too many times" >&2
              exit 1
            fi
            echo "Npm install failed $i, trying again..."
          done
        env:
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Type check /build/ scripts
        run: npm run typecheck
        working-directory: build

      - name: Compile
        run: npm exec -- npm-run-all2 -lp core-ci extensions-ci valid-layers-check define-class-fields-check vscode-dts-compile-check tsec-compile-check test-build-scripts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  linux-electron-tests:
    name: Linux
    uses: ./.github/workflows/namespace-linux-test.yml
    with:
      job_name: Electron
      electron_tests: true

  linux-browser-tests:
    name: Linux
    uses: ./.github/workflows/namespace-linux-test.yml
    with:
      job_name: Browser
      browser_tests: true

  linux-remote-tests:
    name: Linux
    uses: ./.github/workflows/namespace-linux-test.yml
    with:
      job_name: Remote
      remote_tests: true

  macos-electron-tests:
    name: macOS
    uses: ./.github/workflows/namespace-macos-test.yml
    with:
      job_name: Electron
      electron_tests: true

  macos-browser-tests:
    name: macOS
    uses: ./.github/workflows/namespace-macos-test.yml
    with:
      job_name: Browser
      browser_tests: true

  macos-remote-tests:
    name: macOS
    uses: ./.github/workflows/namespace-macos-test.yml
    with:
      job_name: Remote
      remote_tests: true
