name: OpenVSCode Server Release

# Cut a Namespace release from a version-specific release branch in this
# repository. The workflow itself runs from `main`, while every build uses one
# immutable commit resolved from the derived release branch.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'OpenVSCode Server version to release (e.g. 1.109.5)'
        required: true
        type: string
      revision:
        description: 'Namespace revision N (required, starts at 1)'
        required: true
        type: string
        default: '1'
      quality:
        description: 'Release quality'
        required: true
        type: choice
        options:
          - stable
          - insider
        default: stable
      publish:
        description: 'Create the tag and GitHub release (uncheck for a build-only validation run)'
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ inputs.version }}-${{ inputs.revision }}
  cancel-in-progress: true

jobs:
  prepare:
    name: Resolve release metadata
    runs-on: nscloud-ubuntu-22.04-amd64-4x8
    outputs:
      version: ${{ steps.meta.outputs.version }}
      tag: ${{ steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
      source_branch: ${{ steps.meta.outputs.source_branch }}
      source_sha: ${{ steps.meta.outputs.source_sha }}
      upstream_sha: ${{ steps.meta.outputs.upstream_sha }}
    steps:
      - name: Derive source refs
        id: refs
        env:
          VERSION: ${{ inputs.version }}
        run: |
          set -e
          if ! printf '%s\n' "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "version must have the form X.Y.Z (got $VERSION)"
            exit 1
          fi
          echo "source_branch=namespace-release/v${VERSION}" >> "$GITHUB_OUTPUT"
          echo "upstream_ref=openvscode-server-v${VERSION}" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v6
        with:
          ref: ${{ steps.refs.outputs.source_branch }}
          fetch-depth: 0

      - name: Resolve metadata
        id: meta
        env:
          VERSION: ${{ inputs.version }}
          SOURCE_BRANCH: ${{ steps.refs.outputs.source_branch }}
          UPSTREAM_REF: ${{ steps.refs.outputs.upstream_ref }}
        run: |
          set -e
          if [ ! -f .release ]; then
            echo "$SOURCE_BRANCH does not contain a .release file"
            exit 1
          fi
          release_version=$(cat .release)
          if [ "$release_version" != "$VERSION" ]; then
            echo "$SOURCE_BRANCH targets release $release_version, expected $VERSION"
            exit 1
          fi
          package_version=$(node -p "require('./package.json').version")
          if [ "$package_version" != "$VERSION" ]; then
            echo "$SOURCE_BRANCH contains package version $package_version, expected $VERSION"
            exit 1
          fi

          source_sha=$(git rev-parse 'HEAD^{commit}')
          git fetch --no-tags https://github.com/gitpod-io/openvscode-server.git "$UPSTREAM_REF"
          upstream_sha=$(git rev-parse 'FETCH_HEAD^{commit}')
          if ! git merge-base --is-ancestor "$upstream_sha" "$source_sha"; then
            echo "$SOURCE_BRANCH ($source_sha) does not contain upstream $UPSTREAM_REF ($upstream_sha)"
            exit 1
          fi

          rev="${{ inputs.revision }}"
          case "$rev" in
            ''|*[!0-9]*) echo "revision must be a positive integer (got '$rev')"; exit 1 ;;
          esac
          if [ "$rev" -lt 1 ]; then
            echo "revision starts at 1 (got '$rev')"; exit 1
          fi
          if [ "${{ inputs.quality }}" = insider ]; then
            tag="openvscode-server-insiders-v${VERSION}-${rev}"
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            tag="openvscode-server-v${VERSION}-${rev}"
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "source_branch=$SOURCE_BRANCH" >> "$GITHUB_OUTPUT"
          echo "source_sha=$source_sha" >> "$GITHUB_OUTPUT"
          echo "upstream_sha=$upstream_sha" >> "$GITHUB_OUTPUT"
          echo "Building $SOURCE_BRANCH at $source_sha (upstream $UPSTREAM_REF at $upstream_sha) as $tag"

  build:
    name: Build ${{ matrix.os_name }}-${{ matrix.vscode_arch }}
    needs: prepare
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os_name: linux
            runner:
              - nscloud-ubuntu-22.04-amd64-16x32-with-cache
              - nscloud-cache-size-20gb
              - nscloud-cache-tag-ovsc-release-linux-x64
            vscode_arch: x64
            npm_arch: x64
          - os_name: linux
            runner:
              - nscloud-ubuntu-22.04-amd64-16x32-with-cache
              - nscloud-cache-size-20gb
              - nscloud-cache-tag-ovsc-release-linux-arm64
            vscode_arch: arm64
            npm_arch: arm64
          - os_name: darwin
            runner:
              - nscloud-macos-tahoe-arm64-12x28-with-cache
              - nscloud-cache-size-20gb
              - nscloud-cache-tag-ovsc-release-darwin-arm64
            vscode_arch: arm64
            npm_arch: arm64
          # Namespace has no Windows arm64 runners, so win32-arm64 cross-compiles
          # on amd64, as Microsoft's own server build does.
          - os_name: win32
            runner:
              - nscloud-windows-2022-amd64-16x32-with-cache
              - nscloud-cache-size-20gb
              - nscloud-cache-tag-ovsc-release-win32-x64
            vscode_arch: x64
            npm_arch: x64
          - os_name: win32
            runner:
              - nscloud-windows-2022-amd64-16x32-with-cache
              - nscloud-cache-size-20gb
              - nscloud-cache-tag-ovsc-release-win32-arm64
            vscode_arch: arm64
            npm_arch: arm64
    defaults:
      run:
        # Every step is a shell script; Windows defaults to pwsh.
        shell: bash
    env:
      OS_NAME: ${{ matrix.os_name }}
      VSCODE_ARCH: ${{ matrix.vscode_arch }}
      NPM_REGISTRY: https://registry.npmjs.org
      npm_config_arch: ${{ matrix.npm_arch }}
      CXXFLAGS: ${{ matrix.os_name == 'darwin' && '-DFMT_CONSTEVAL=' || '' }}
      DISABLE_V8_COMPILE_CACHE: 1
      NODE_OPTIONS: ${{ matrix.os_name == 'darwin' && '--max-old-space-size=12288' || '' }}
      QUALITY: ${{ inputs.quality }}
    steps:
      - name: Set up QEMU
        if: matrix.os_name == 'linux'
        uses: docker/setup-qemu-action@v4

      - uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 20

      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc

      - name: Cache npm downloads (Namespace Cache Volume)
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: npm

      - name: Setup Linux system services
        if: matrix.os_name == 'linux'
        run: |
          set -e
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get update
          ./build/azure-pipelines/linux/apt-retry.sh sudo apt-get install -y \
            pkg-config dbus xvfb libgtk-3-0 libxkbfile-dev libkrb5-dev libgbm1 rpm
          sudo cp build/azure-pipelines/linux/xvfb.init /etc/init.d/xvfb
          sudo chmod +x /etc/init.d/xvfb
          sudo update-rc.d xvfb defaults
          sudo service xvfb start

      - name: Compute node modules cache key
        id: node_modules_cache_key
        run: |
          mkdir -p .build
          value=$(node build/azure-pipelines/common/computeNodeModulesCacheKey.ts \
            "$OS_NAME" "$VSCODE_ARCH" "$(node -p process.arch)")
          echo "value=$value" >> "$GITHUB_OUTPUT"

      - name: Cache node modules
        id: cache_node_modules
        uses: actions/cache@v5
        with:
          path: '**/node_modules'
          key: ${{ runner.os }}-${{ matrix.os_name }}-${{ matrix.vscode_arch }}-${{ needs.prepare.outputs.source_sha }}-node_modules-${{ steps.node_modules_cache_key.outputs.value }}

      - name: Install dependencies
        if: steps.cache_node_modules.outputs.cache-hit != 'true'
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
          ELECTRON_SKIP_BINARY_DOWNLOAD: 1
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          npm config set registry "$NPM_REGISTRY"
          cd build
          for i in {1..5}; do
            npm ci && break
            if [ "$i" -eq 5 ]; then
              echo 'Build dependency installation failed too many times'
              exit 1
            fi
          done
          cd ..
          if [ "$OS_NAME" = linux ]; then
            source ./build/azure-pipelines/linux/setup-env.sh
          fi
          node build/npm/preinstall.ts
          for i in {1..5}; do
            npm ci && break
            if [ "$i" -eq 5 ]; then
              echo 'Dependency installation failed too many times'
              exit 1
            fi
          done

      - name: Update product.json
        run: |
          set -e
          name_short=$(jq --raw-output '.nameShort' product.json)
          name_long=$(jq --raw-output '.nameLong' product.json)
          if [ "$QUALITY" = insider ]; then
            name_short="$name_short - Insiders"
            name_long="$name_long - Insiders"
          fi
          jq --arg quality "$QUALITY" \
            --arg name_short "$name_short" \
            --arg name_long "$name_long" \
            '.quality = $quality | .nameShort = $name_short | .nameLong = $name_long' \
            product.json > product.json.tmp
          mv product.json.tmp product.json
          jq '{quality,nameLong,nameShort}' product.json

      - name: Prepare for distribution
        run: |
          set -e
          base_commit=$(git log --pretty='%H' --max-count=1 \
            --grep='code web server initial commit')
          if [ -z "$base_commit" ]; then
            git fetch --unshallow
            base_commit=$(git log --pretty='%H' --max-count=1 \
              --grep='code web server initial commit')
          fi
          if [ -z "$base_commit" ]; then
            echo 'Could not find base commit'
            exit 1
          fi
          distro_commit=$(git rev-parse "${base_commit}"~)
          echo "BUILD_SOURCEVERSION=$distro_commit" >> "$GITHUB_ENV"
          echo "distro_commit: $distro_commit"

      - name: Compile VS Code
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          npm run gulp core-ci
          npm run gulp extensions-ci

      - name: Cache built-in extensions (Namespace Cache Volume)
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          path: .build/builtInExtensions

      - name: Download built-in extensions
        run: node build/lib/builtInExtensions.ts
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build web server
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          npm run gulp "vscode-reh-web-${OS_NAME}-${VSCODE_ARCH}-min-ci"

      - name: Bundle tarball
        id: bundle_tar
        env:
          RELEASE_TAG: ${{ needs.prepare.outputs.tag }}
        run: |
          set -e
          name="${RELEASE_TAG}-${OS_NAME}-${VSCODE_ARCH}"
          build_dir="../vscode-reh-web-${OS_NAME}-${VSCODE_ARCH}"
          # The gulp task's output root is the directory that holds the server
          # entrypoint (bin/ + product.json). Locate it so the tarball is a flat
          # server tree matching upstream, regardless of any wrapper directory.
          if [ -f "$build_dir/product.json" ] && [ -d "$build_dir/bin" ]; then
            server_root="$build_dir"
          else
            server_root=$(dirname "$(find "$build_dir" -maxdepth 4 -type d -name bin \
              -exec test -f '{}/../product.json' ';' -print -quit)")
          fi
          if [ ! -f "$server_root/product.json" ]; then
            echo "Could not locate server root under $build_dir"; ls -laR "$build_dir" | head -50; exit 1
          fi
          rm -rf "$name"
          mv "$server_root" "$name"
          tar -czf "$name.tar.gz" -C . "$name"
          echo "Packaged $name.tar.gz with root entries:"; tar -tzf "$name.tar.gz" | awk -F/ 'NF>1{print $2}' | sort -u
          echo "name=$name" >> "$GITHUB_OUTPUT"

      - name: Upload build artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ matrix.os_name }}-${{ matrix.vscode_arch }}
          path: ${{ steps.bundle_tar.outputs.name }}.tar.gz
          if-no-files-found: error
          retention-days: 7

  github-release:
    name: Publish GitHub release
    needs: [prepare, build]
    if: ${{ inputs.publish }}
    runs-on: nscloud-ubuntu-22.04-amd64-4x8
    permissions:
      contents: write
    steps:
      - name: Check out built source
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.prepare.outputs.source_sha }}
          fetch-depth: 0

      - name: Create and push release tag
        env:
          TAG: ${{ needs.prepare.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SOURCE_SHA: ${{ needs.prepare.outputs.source_sha }}
        run: |
          set -e
          if git ls-remote --exit-code --tags \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            "refs/tags/${TAG}" >/dev/null 2>&1; then
            echo "Tag ${TAG} already exists in ${{ github.repository }}"
            exit 1
          fi
          git -c user.name='github-actions[bot]' \
              -c user.email='github-actions[bot]@users.noreply.github.com' \
            tag -a "${TAG}" "$SOURCE_SHA" -m "OpenVSCode Server ${TAG}"
          git push \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" \
            "refs/tags/${TAG}"

      - name: Download artifacts
        uses: actions/download-artifact@v6
        with:
          path: artifacts

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            OpenVSCode Server ${{ needs.prepare.outputs.tag }}

            Built from `${{ needs.prepare.outputs.source_branch }}` at `${{ needs.prepare.outputs.source_sha }}`.
            Includes upstream `openvscode-server-v${{ inputs.version }}` at `${{ needs.prepare.outputs.upstream_sha }}`.
          tag_name: ${{ needs.prepare.outputs.tag }}
          prerelease: ${{ needs.prepare.outputs.prerelease == 'true' }}
          files: artifacts/**/*.tar.gz
